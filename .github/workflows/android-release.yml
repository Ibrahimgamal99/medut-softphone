name: Android release

# Pushing a tag such as v0.2.0 builds the signed release APK and attaches it
# to a GitHub Release for that tag. The tag must match `version:` in
# pubspec.yaml so the installed app and the release page agree.
#
# Signing comes from repository secrets, written back into the files that
# android/app/build.gradle.kts already reads for a local build:
#   ANDROID_KEYSTORE_BASE64   upload-keystore.jks, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON      optional; enables the FCM wake-up
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    name: flutter build apk --release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Version from pubspec.yaml must match the tag
        id: version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "Tag ${GITHUB_REF#refs/tags/} does not match pubspec version $version" >&2
            exit 1
          fi

      - name: Dart analysis and tests
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Signing files from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=../upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Build release APK
        # Dart debug info is kept beside the APK: it is the only way to read
        # this build's Dart stack traces (see scripts/build-release.sh).
        run: flutter build apk --release --split-debug-info="symbols/${{ steps.version.outputs.version }}"

      - name: Verify the APK is not debug-signed
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs" | grep "certificate DN"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "APK is signed with the debug key" >&2
            exit 1
          fi

      - name: Rename and checksum
        run: |
          out="medut-softphone-${{ steps.version.outputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          tar czf "medut-softphone-${{ steps.version.outputs.version }}-symbols.tar.gz" symbols

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: medut-softphone-${{ steps.version.outputs.version }}
          path: |
            medut-softphone-*.apk*
            medut-softphone-*-symbols.tar.gz

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Medut Softphone ${tag#v}" --generate-notes
          fi
          gh release upload "$tag" medut-softphone-*.apk medut-softphone-*.apk.sha256 \
            medut-softphone-*-symbols.tar.gz --clobber
