name: medut_phone
description: "Medut — a softphone for any SIP PBX, built on Medut-SDK."
publish_to: "none"
version: 0.1.2+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Medut-SDK: brings its Kotlin SDK (Android) and MedutKit (iOS) into the
  # build, which the native PhoneEngine drives, and on Linux and Windows the
  # prebuilt C library (medut.so / medut.dll) lib/desktop/engine.dart drives
  # over dart:ffi. Pinned to a full sha so the binaries cannot move under a build.
  medut:
    git:
      url: https://github.com/Ibrahimgamal99/Medut-SDK.git
      path: bindings/flutter
      ref: 9ffd8716eed5cfed1c1411ea5fd0619280602989

  flutter_riverpod: ^2.6.1

  # Accounts: passwords in Keychain/Keystore, everything else in prefs
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  # Call history + SIP MESSAGE threads
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  easy_localization: ^3.0.7
  intl: ^0.20.2

  permission_handler: ^11.3.1

  # Add-account: scan a provisioning QR, or import an account JSON file
  mobile_scanner: ^6.0.2
  file_picker: ">=10.1.0 <11.0.0"
  # Contacts tab (device address book)
  flutter_contacts: ^1.1.9+2
  # Export SIP log / pcap
  share_plus: ^10.1.4
  google_fonts: ^8.2.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  qr_flutter: ^4.1.0

  # Desktop (Linux, Windows): none of these is used on Android or iOS.
  # The window (and where the ringing card goes), the tray icon, "start at login"
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  tray_manager: ^0.5.3
  launch_at_startup: ^0.5.1
  # medut.db through sqlite3 over FFI. Kept on the 2.3 line: its sqlite3 2.x
  # loads the system library (desktop/sqlite.dart) where 3.x would add a
  # build hook to every platform, Android included.
  sqflite_common_ffi: ">=2.3.0 <2.4.0"
  sqlite3: ^2.9.4
  # Incoming-call and missed-call notifications on Linux
  flutter_local_notifications_linux: ^8.0.2
  # Windows: the ringtone (winmm PlaySound) and the tel:/sip: registry keys
  win32: ^5.15.0
  win32_registry: ^2.1.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/sounds/ringtones/
