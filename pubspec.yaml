name: medut_phone
description: "Medut — a softphone for any SIP PBX, built on Medut-SDK."
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Medut-SDK: brings its Kotlin SDK (Android) and MedutKit (iOS) into the
  # build. The app's native PhoneEngine drives them; Dart never imports it.
  # Pinned to a full sha so the native binaries cannot move under a build.
  medut:
    git:
      url: https://github.com/Ibrahimgamal99/Medut-SDK.git
      path: bindings/flutter
      ref: 88c1c463ad59fc1b448fea35424da044a81e85b7

  flutter_riverpod: ^2.6.1

  # Accounts: passwords in Keychain/Keystore, everything else in prefs
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  # Call history + SIP MESSAGE threads
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  easy_localization: ^3.0.7
  intl: ^0.20.2

  permission_handler: ^11.3.1

  # Add-account: scan a provisioning QR, or import an account JSON file
  mobile_scanner: ^6.0.2
  file_picker: ">=10.1.0 <11.0.0"
  # Contacts tab (device address book)
  flutter_contacts: ^1.1.9+2
  # Export SIP log / pcap
  share_plus: ^10.1.4
  google_fonts: ^8.2.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/sounds/ringtones/
