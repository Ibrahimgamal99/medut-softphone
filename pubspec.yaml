name: medut_phone
description: "Medut — a softphone for any SIP PBX, built on Medut-SDK."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # SIP + media core (baresip over dart:ffi). Pinned to a full sha so the
  # native binaries cannot move under a build.
  medut:
    git:
      url: https://github.com/Ibrahimgamal99/Medut-SDK.git
      path: bindings/flutter
      ref: 4d6d8c89e841b43f8a51cb43d61b23f8abb6a5a6

  flutter_riverpod: ^2.6.1

  # Accounts: passwords in Keychain/Keystore, everything else in prefs
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  # Call history + SIP MESSAGE threads
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  easy_localization: ^3.0.7
  intl: ^0.20.2

  permission_handler: ^11.3.1
  # FCM wake-up (Android). Optional: the app runs without google-services.json.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Add-account: scan a provisioning QR, or import an account JSON file
  mobile_scanner: ^6.0.2
  file_picker: ">=10.1.0 <11.0.0"
  # Contacts tab (device address book)
  flutter_contacts: ^1.1.9+2
  # Export SIP log / pcap
  share_plus: ^10.1.4
  google_fonts: ^9.0.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  proximity_screen_lock: ^2.3.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/sounds/
    - assets/sounds/ringtones/
