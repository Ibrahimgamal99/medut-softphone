<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signed in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.pk{--bg:#0C0E10;--sf:#16191C;--sf2:#1F2327;--bd:#2A2F34;--tx:#F2F4F6;--tx2:#A0A8B2;--mu:#6F7781;--ac:#3DD49A;--acs:rgba(61,212,154,.14);--onac:#04271A;--bad:#FF6B70;--bads:rgba(255,90,95,.14);--dim:rgba(0,0,0,.62);width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--tx);font-family:"Figtree",system-ui,sans-serif;display:flex;flex-direction:column}
.pk.light{--bg:#F3F4F6;--sf:#FFFFFF;--sf2:#E9ECEF;--bd:#E0E3E8;--tx:#0E1116;--tx2:#5D6470;--mu:#8A919B;--ac:#08805A;--acs:#DCF2E8;--onac:#FFFFFF;--bad:#C62828;--bads:#FDE6E6;--dim:rgba(14,17,22,.4)}
.pk *{box-sizing:border-box}
.pk button,.pk input{font:inherit;color:inherit}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fld{display:block;background:var(--sf);border-radius:18px;padding:9px 16px 10px;border:1.5px solid transparent;box-shadow:0 1px 0 var(--bd)}
.fld small{display:block;font-size:11px;font-weight:600;color:var(--tx2)}
.fld input{display:block;width:100%;min-width:0;border:0;background:none;padding:2px 0 0;font-size:16px;font-weight:500;outline:none}
.fld input::placeholder{color:var(--mu)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:27px;border:0;background:var(--ac);color:var(--onac);font-size:16px;font-weight:700;cursor:pointer}
.kv{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd)}
.kv:first-child{border-top:0}
.kv .ic{color:var(--ac)}
.kv span{flex:1;font-size:13px;color:var(--tx2)}
.kv b{font-size:13.5px;font-weight:600;text-align:right}
.perm{display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.35}
.perm .ic{color:var(--tx2)}
</style>
</helmet>
<div class="pk {{theme}}">
  <div style="display: flex; flex-direction: column; flex: 1; padding: 14px 22px 0">
    <div style="display: grid; place-items: center; margin-top: 56px">
      <span style="width: 72px; height: 72px; border-radius: 50%; background: var(--acs); color: var(--ac); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 34px; height: 34px; stroke-width: 2.6"><path d="M20 6 9 17l-5-5"></path></svg></span>
    </div>
    <h1 style="margin: 20px 0 6px; text-align: center; font-size: 30px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1">You're signed in</h1>
    <p style="margin: 0 0 22px; text-align: center; font-size: 14.5px; color: var(--tx2)">201 at pbx.acme.com is ready for calls.</p>

    <div style="padding: 3px 16px; border-radius: 20px; background: var(--sf)">
      <div class="kv">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        <span>Connection</span><b>Secure web link · 443</b>
      </div>
      <div class="kv">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span>Calls</span><b>Encrypted (DTLS)</b>
      </div>
      <div class="kv">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h2M6 8v8M10 5v14M14 8v8M18 10v4M22 12h0"></path></svg>
        <span>Sound</span><b>Opus, then G.722, PCMA</b>
      </div>
    </div>

    <label class="fld" style="margin-top: 12px"><small>Your name on calls (optional)</small><input type="text" placeholder="Shown to the people you call"></label>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 22px; padding: 0 6px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tx2)">Next, two permissions</div>
      <div class="perm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"></path></svg><span>Microphone, so people can hear you</span></div>
      <div class="perm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span>Notifications, so calls ring when the app is closed</span></div>
    </div>

    <div style="flex: 1"></div>
    <button class="btn" type="button" style="margin-bottom: 22px">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
