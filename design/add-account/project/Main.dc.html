<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in, one smart field</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.pk{--bg:#0C0E10;--sf:#16191C;--sf2:#1F2327;--bd:#2A2F34;--tx:#F2F4F6;--tx2:#A0A8B2;--mu:#6F7781;--ac:#3DD49A;--acs:rgba(61,212,154,.14);--onac:#04271A;--bad:#FF6B70;--bads:rgba(255,90,95,.14);--dim:rgba(0,0,0,.62);width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--tx);font-family:"Figtree",system-ui,sans-serif;display:flex;flex-direction:column}
.pk.light{--bg:#F3F4F6;--sf:#FFFFFF;--sf2:#E9ECEF;--bd:#E0E3E8;--tx:#0E1116;--tx2:#5D6470;--mu:#8A919B;--ac:#08805A;--acs:#DCF2E8;--onac:#FFFFFF;--bad:#C62828;--bads:#FDE6E6;--dim:rgba(14,17,22,.4)}
.pk *{box-sizing:border-box}
.pk button,.pk input{font:inherit;color:inherit}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fld{display:block;background:var(--sf);border-radius:18px;padding:9px 16px 10px;border:1.5px solid transparent;box-shadow:0 1px 0 var(--bd)}
.fld.on{border-color:var(--ac)}
.fld small{display:block;font-size:11px;font-weight:600;color:var(--tx2)}
.fld input{display:block;width:100%;min-width:0;border:0;background:none;padding:2px 0 0;font-size:16px;font-weight:500;outline:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:27px;border:0;background:var(--ac);color:var(--onac);font-size:16px;font-weight:700;cursor:pointer}
.tbtn{border:0;background:none;cursor:pointer;color:var(--tx2);font-weight:600;font-size:14px;min-height:44px;padding:0 6px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:84px;border-radius:18px;border:1px solid var(--bd);background:var(--sf);cursor:pointer;font-size:13px;font-weight:600}
.tile .ic{width:22px;height:22px;color:var(--ac)}
</style>
</helmet>
<div class="pk {{theme}}">
  <div style="display: flex; flex-direction: column; flex: 1; padding: 14px 22px 0">
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
      <div style="display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; letter-spacing: -0.2px">
        <span style="width: 26px; height: 26px; border-radius: 9px; background: var(--ac); color: var(--onac); display: grid; place-items: center"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="fill: currentColor"><rect x="3.5" y="9" width="2.8" height="6" rx="1.4"></rect><rect x="8.2" y="5.5" width="2.8" height="13" rx="1.4"></rect><rect x="12.9" y="2.5" width="2.8" height="19" rx="1.4"></rect><rect x="17.6" y="7" width="2.8" height="10" rx="1.4"></rect></svg></span>
        medut
      </div>
      <button class="tbtn" type="button" lang="ar">العربية</button>
    </div>

    <h1 style="margin: 30px 0 8px; font-size: 34px; font-weight: 800; letter-spacing: -1px; line-height: 1.05">Sign in</h1>
    <p style="margin: 0 0 22px; font-size: 14.5px; line-height: 1.4; color: var(--tx2)">Use the details your phone system admin gave you.</p>

    <label class="fld on"><small>SIP address</small><input type="text" value="201@pbx.acme.com" autocomplete="username"></label>
    <p style="margin: 7px 10px 12px; font-size: 12px; line-height: 1.4; color: var(--tx2)">Extension, @, then your server. We find the way to connect, web links (WSS) included.</p>

    <label class="fld"><small>Password</small>
      <span style="display: flex; align-items: center; gap: 8px">
        <input type="password" value="secret-pass" autocomplete="current-password">
        <button type="button" aria-label="Show password" style="border: 0; background: none; padding: 0; color: var(--tx2); cursor: pointer; display: grid; place-items: center; width: 32px; height: 28px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </span>
    </label>

    <button class="btn" type="button" style="margin-top: 20px">Sign in</button>

    <p style="margin: 30px 0 10px; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--tx2)">Or set up from what your admin sent</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button class="tile" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 17h4v4h-4z"></path></svg>Scan QR</button>
      <button class="tile" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>Import file</button>
      <button class="tile" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>Paste</button>
    </div>

    <div style="flex: 1"></div>
    <button class="tbtn" type="button" style="display: flex; align-items: center; justify-content: center; gap: 7px; align-self: center; margin-bottom: 14px; font-size: 13.5px">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"></path></svg>
      More options
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
