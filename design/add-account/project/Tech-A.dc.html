<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Technical settings, sections</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.pk{--bg:#0C0E10;--sf:#16191C;--sf2:#1F2327;--bd:#2A2F34;--tx:#F2F4F6;--tx2:#A0A8B2;--mu:#6F7781;--ac:#3DD49A;--acs:rgba(61,212,154,.14);--onac:#04271A;--bad:#FF6B70;--bads:rgba(255,90,95,.14);--dim:rgba(0,0,0,.62);width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--tx);font-family:"Figtree",system-ui,sans-serif;display:flex;flex-direction:column}
.pk.light{--bg:#F3F4F6;--sf:#FFFFFF;--sf2:#E9ECEF;--bd:#E0E3E8;--tx:#0E1116;--tx2:#5D6470;--mu:#8A919B;--ac:#08805A;--acs:#DCF2E8;--onac:#FFFFFF;--bad:#C62828;--bads:#FDE6E6;--dim:rgba(14,17,22,.4)}
.pk *{box-sizing:border-box}
.pk button,.pk input{font:inherit;color:inherit}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:27px;border:0;background:var(--ac);color:var(--onac);font-size:16px;font-weight:700;cursor:pointer}
.chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--bd);background:var(--sf);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip .ic{width:15px;height:15px;color:var(--ac)}
.sec{display:flex;align-items:center;gap:13px;width:100%;text-align:left;min-height:54px;padding:8px 14px;border:0;border-top:1px solid var(--bd);background:none;cursor:pointer}
.sec:first-child{border-top:0}
.sec .ico{width:32px;height:32px;border-radius:10px;background:var(--sf2);color:var(--tx);display:grid;place-items:center;flex:none}
.sec .ico .ic{width:16px;height:16px}
.sec .t{flex:1;min-width:0}
.sec b{display:block;font-size:14.5px;font-weight:600}
.sec small{display:block;font-family:"DM Mono",ui-monospace,monospace;font-size:11px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec .chev{color:var(--tx2);width:16px;height:16px}
</style>
</helmet>
<div class="pk {{theme}}">
  <div style="display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 6px 10px 0">
    <button type="button" aria-label="Back" style="border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="m15 18-6-6 6-6"></path></svg></button>
    <h1 style="margin: 0; flex: 1; font-size: 19px; font-weight: 800; letter-spacing: -0.2px">Technical settings</h1>
    <button type="button" aria-label="Share as QR code" style="border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; color: var(--tx2); cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 17h4v4h-4z"></path></svg></button>
  </div>

  <div style="display: flex; flex-direction: column; flex: 1; padding: 6px 16px 0">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; background: var(--sf)">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: var(--acs); color: var(--ac); display: grid; place-items: center; font-weight: 800; font-size: 14px">201</span>
      <span style="flex: 1; min-width: 0">
        <span style="display: block; font-size: 15px; font-weight: 700">Office PBX</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tx2); margin-top: 2px"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--mu)"></span>Not tested yet</span>
      </span>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid var(--ac); background: none; color: var(--ac); font-size: 13px; font-weight: 700; cursor: pointer">Test</button>
    </div>

    <div style="display: flex; gap: 8px; margin: 12px 0 14px">
      <button class="chip" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 17h4v4h-4z"></path></svg>Scan</button>
      <button class="chip" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>Import</button>
      <button class="chip" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>Paste</button>
      <button class="chip" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"></path></svg>JSON</button>
    </div>

    <nav aria-label="Settings sections" style="border-radius: 20px; background: var(--sf); overflow: hidden">
      <button class="sec" type="button"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span><span class="t"><b>Sign-in</b><small>201 · login 201 · Office PBX</small></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      <button class="sec" type="button"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></span><span class="t"><b>Connection</b><small>WSS · wss://pbx.acme.com/sip-ws</small></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      <button class="sec" type="button"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span><span class="t"><b>Security</b><small>DTLS-SRTP · certificate checked</small></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      <button class="sec" type="button"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path></svg></span><span class="t"><b>Network</b><small>ICE on · STUN stun.acme.com · no TURN</small></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      <button class="sec" type="button"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h2M6 8v8M10 5v14M14 8v8M18 10v4M22 12h0"></path></svg></span><span class="t"><b>Audio</b><small>opus › G.722 › PCMA</small></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      <button class="sec" type="button"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span><span class="t"><b>Calls</b><small>DTMF RFC 4733 · voicemail *97</small></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      <button class="sec" type="button"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"></path></svg></span><span class="t"><b>Dialing</b><small>prefix 9 · + becomes 00</small></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      <button class="sec" type="button"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M12 8v8M8 12h8"></path></svg></span><span class="t"><b>Extras</b><small>2 headers · push on · default account</small></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
    </nav>

    <div style="flex: 1"></div>
    <button class="btn" type="button">Save and connect</button>
    <p style="margin: 8px 0 16px; text-align: center; font-size: 12px; color: var(--tx2)">We test the connection before saving.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
