<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in, server first</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.pk{--bg:#0C0E10;--sf:#16191C;--sf2:#1F2327;--bd:#2A2F34;--tx:#F2F4F6;--tx2:#A0A8B2;--mu:#6F7781;--ac:#3DD49A;--acs:rgba(61,212,154,.14);--onac:#04271A;--bad:#FF6B70;--bads:rgba(255,90,95,.14);--dim:rgba(0,0,0,.62);width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--tx);font-family:"Figtree",system-ui,sans-serif;display:flex;flex-direction:column}
.pk.light{--bg:#F3F4F6;--sf:#FFFFFF;--sf2:#E9ECEF;--bd:#E0E3E8;--tx:#0E1116;--tx2:#5D6470;--mu:#8A919B;--ac:#08805A;--acs:#DCF2E8;--onac:#FFFFFF;--bad:#C62828;--bads:#FDE6E6;--dim:rgba(14,17,22,.4)}
.pk *{box-sizing:border-box}
.pk button,.pk input{font:inherit;color:inherit}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fld{display:block;background:var(--sf);border-radius:18px;padding:9px 16px 10px;border:1.5px solid transparent;box-shadow:0 1px 0 var(--bd)}
.fld.on{border-color:var(--ac)}
.fld small{display:block;font-size:11px;font-weight:600;color:var(--tx2)}
.fld input{display:block;width:100%;min-width:0;border:0;background:none;padding:2px 0 0;font-size:16px;font-weight:500;outline:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:27px;border:0;background:var(--ac);color:var(--onac);font-size:16px;font-weight:700;cursor:pointer}
.tbtn{border:0;background:none;cursor:pointer;color:var(--tx2);font-weight:600;font-size:14px;min-height:44px;padding:0 6px}
.step{display:flex;align-items:center;gap:8px;margin:0 0 9px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.step b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;letter-spacing:0;background:var(--sf2);color:var(--tx)}
.step b.done{background:var(--ac);color:var(--onac)}
</style>
</helmet>
<div class="pk {{theme}}">
  <div style="display: flex; flex-direction: column; flex: 1; padding: 14px 22px 0">
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
      <button type="button" aria-label="Back" style="border: 0; background: none; padding: 0; width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; color: var(--tx); cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="m15 18-6-6 6-6"></path></svg></button>
      <button class="tbtn" type="button" lang="ar">العربية</button>
    </div>

    <h1 style="margin: 16px 0 8px; font-size: 34px; font-weight: 800; letter-spacing: -1px; line-height: 1.05">Add an account</h1>
    <p style="margin: 0 0 22px; font-size: 14.5px; line-height: 1.4; color: var(--tx2)">Start with the server. We check how to reach it before asking for your password.</p>

    <p class="step"><b class="done"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 11px; height: 11px; stroke-width: 3.2"><path d="M20 6 9 17l-5-5"></path></svg></b>Your phone system</p>
    <label class="fld"><small>Server</small><input type="text" value="pbx.acme.com"></label>

    <div style="display: flex; gap: 12px; align-items: flex-start; margin-top: 8px; padding: 12px 14px; border-radius: 16px; background: var(--acs)">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ac); margin-top: 1px"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 14px; font-weight: 700">Found it: a secure web link</div>
        <div class="mono" style="font-size: 11.5px; color: var(--tx2); margin-top: 2px">wss://pbx.acme.com/sip-ws</div>
        <div style="font-size: 12px; color: var(--tx2); margin-top: 3px">Calls will be encrypted (DTLS).</div>
      </div>
      <button class="tbtn" type="button" style="min-height: 32px; color: var(--ac); font-size: 13px; padding: 0">Change</button>
    </div>

    <p class="step" style="margin-top: 26px"><b>2</b>Your extension</p>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <label class="fld on"><small>Extension</small><input type="text" value="201" inputmode="numeric"></label>
      <label class="fld"><small>Password</small>
        <span style="display: flex; align-items: center; gap: 8px">
          <input type="password" value="secret-pass">
          <button type="button" aria-label="Show password" style="border: 0; background: none; padding: 0; color: var(--tx2); cursor: pointer; display: grid; place-items: center; width: 32px; height: 28px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </span>
      </label>
    </div>

    <button class="btn" type="button" style="margin-top: 20px">Sign in</button>

    <div style="flex: 1"></div>
    <button class="tbtn" type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; align-self: center; margin-bottom: 14px; color: var(--tx)">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 17h4v4h-4z"></path></svg>
      Scan a QR code instead
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
