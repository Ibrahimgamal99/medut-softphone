<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Technical settings, connection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.pk{--bg:#0C0E10;--sf:#16191C;--sf2:#1F2327;--bd:#2A2F34;--tx:#F2F4F6;--tx2:#A0A8B2;--mu:#6F7781;--ac:#3DD49A;--acs:rgba(61,212,154,.14);--onac:#04271A;--bad:#FF6B70;--bads:rgba(255,90,95,.14);--dim:rgba(0,0,0,.62);width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--tx);font-family:"Figtree",system-ui,sans-serif;display:flex;flex-direction:column}
.pk.light{--bg:#F3F4F6;--sf:#FFFFFF;--sf2:#E9ECEF;--bd:#E0E3E8;--tx:#0E1116;--tx2:#5D6470;--mu:#8A919B;--ac:#08805A;--acs:#DCF2E8;--onac:#FFFFFF;--bad:#C62828;--bads:#FDE6E6;--dim:rgba(14,17,22,.4)}
.pk *{box-sizing:border-box}
.pk button,.pk input{font:inherit;color:inherit}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fld{display:block;background:var(--sf);border-radius:16px;padding:8px 14px 9px;border:1.5px solid transparent}
.fld.on{border-color:var(--ac)}
.fld small{display:block;font-size:11px;font-weight:600;color:var(--tx2)}
.fld input{display:block;width:100%;min-width:0;border:0;background:none;padding:2px 0 0;font-size:14px;font-weight:500;outline:none}
.fld input::placeholder{color:var(--mu)}
.rad{display:flex;align-items:center;gap:13px;min-height:52px;padding:7px 14px;border-top:1px solid var(--bd);cursor:pointer}
.rad:first-child{border-top:0}
.rad input{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;border-radius:50%;border:2px solid var(--mu);flex:none}
.rad input:checked{border:6px solid var(--ac)}
.rad b{display:block;font-size:14.5px;font-weight:600}
.rad small{display:block;font-size:12px;color:var(--tx2);margin-top:1px}
.sw{position:relative;width:46px;height:28px;border-radius:14px;border:0;padding:0;background:var(--sf2);cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--ac)}
.sw[aria-checked="true"]::after{left:21px}
.lbl{margin:16px 6px 7px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
</style>
</helmet>
<div class="pk {{theme}}">
  <div style="display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 6px 10px 0">
    <button type="button" aria-label="Back" style="border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="m15 18-6-6 6-6"></path></svg></button>
    <h1 style="margin: 0; flex: 1; font-size: 19px; font-weight: 800; letter-spacing: -0.2px">Connection</h1>
  </div>

  <div style="display: flex; flex-direction: column; flex: 1; padding: 0 16px">
    <p class="lbl" style="margin-top: 8px">How to reach the server</p>
    <fieldset style="margin: 0; padding: 0; border: 0; border-radius: 20px; background: var(--sf); overflow: hidden">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">How to reach the server</legend>
      <label class="rad"><input type="radio" name="tr"><span><b>Automatic</b><small>Try every way, keep the first that works</small></span></label>
      <label class="rad"><input type="radio" name="tr"><span><b>Secure (TLS)</b><small>Port 5061</small></span></label>
      <label class="rad"><input type="radio" name="tr"><span><b>TCP</b><small>Port 5060</small></span></label>
      <label class="rad"><input type="radio" name="tr"><span><b>UDP</b><small>Port 5060 · least reliable on mobile data</small></span></label>
      <label class="rad"><input type="radio" name="tr" checked><span><b>Web link (WSS)</b><small>WebRTC servers · port from the link</small></span></label>
      <label class="rad"><input type="radio" name="tr"><span><b>Web link, not secure (WS)</b><small>Test servers only</small></span></label>
    </fieldset>

    <p class="lbl">Server</p>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label class="fld on"><small>Web link</small><input class="mono" type="url" value="wss://pbx.acme.com/sip-ws"></label>
      <label class="fld"><small>Outbound proxy</small><input class="mono" type="text" placeholder="sip:proxy.acme.com;lr"></label>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--sf)">
      <span style="flex: 1"><span style="display: block; font-size: 14.5px; font-weight: 600">Check the server's certificate</span><span style="display: block; font-size: 12px; color: var(--tx2); margin-top: 2px">Turn off only for a test server</span></span>
      <button class="sw" type="button" role="switch" aria-checked="true" aria-label="Check the server's certificate"></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
